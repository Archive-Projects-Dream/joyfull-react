<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090704">
  <meta name="description" content="HORIZON-DREAM — Beyond the station.">
  <title>HORIZON-DREAM</title>
</head>
<body data-theme="amber">
  <canvas id="warp" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div class="crt" id="crt" aria-hidden="true"></div>

  <header class="header">
    <div class="header__system"><span class="live-dot" aria-hidden="true"></span>SYS // HORIZON-DREAM / ONLINE</div>
    <div class="header__protocol">PROTOCOL // BYOND / SS13</div>
    <div class="header__status">STATUS // OPEN BUILD</div>
  </header>

  <div class="controls" role="group" aria-label="Display settings">
    <span class="controls__label">PHOSPHOR</span>
    <button type="button" data-theme="amber" aria-pressed="true">AMBER</button>
    <button type="button" data-theme="green" aria-pressed="false">GREEN</button>
    <button type="button" data-theme="blue" aria-pressed="false">BLUE</button>
    <button type="button" id="scan-toggle" aria-pressed="true">SCANLINES ON</button>
  </div>

  <main class="container">
    <section class="cosmic-core" aria-label="Abstract cosmic core">
      <div class="core-center" aria-hidden="true"></div>
      <div class="orbital-layer" id="orbital-planes" aria-hidden="true"></div>
    </section>

    <div class="brand-lockup">
      <svg class="brand-lockup__logo" viewBox="0 0 350 350" aria-hidden="true" focusable="false">
        <path d="M230.9 257.5h26.7v20.7h-68.7V71.8h68.7v20.7h-26.7c-7.1 0-12.8 5.7-12.8 12.8v139.5c0 7.1 5.7 12.8 12.8 12.8ZM92.4 71.8v20.7h26.7c7.1 0 12.8 5.7 12.8 12.8v139.5c0 7.1-5.7 12.8-12.8 12.8h-26.7v20.7h68.7V71.8H92.4ZM92.4 188.7v27.6H0v-27.6h92.4ZM257.6 188.7v27.6h92.4v-27.6h-92.4ZM0 133.4v27.9h92.4v-27.9H0ZM257.6 133.4v27.9h92.4v-27.9h-92.4Z" />
      </svg>
      <div class="project-name">Horizon-Dream</div>
      <div class="project-sub">// Beyond the station</div>
    </div>
  </main>

  <nav class="footer" aria-label="Project links">
    <a href="https://github.com/horizon-dev-team/Horizon-Dream" class="link-item" target="_blank" rel="noopener noreferrer">GitHub</a>
    <span class="separator" aria-hidden="true">/</span>
    <a href="https://discord.gg/7mVfEnvam7" class="link-item" target="_blank" rel="noopener noreferrer">Discord</a>
    <span class="separator" aria-hidden="true">/</span>
    <a href="https://horizon-dev-team.github.io/Horizon-Changelog/" class="link-item">Changelog</a>
    <span class="separator" aria-hidden="true">/</span>
    <a href="#" class="link-item" data-placeholder>Wiki</a>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
